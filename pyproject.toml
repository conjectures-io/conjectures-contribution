[project]
name = "conjectures-contribution"
version = "0.1.0"
description = "Contribution format, validation, and tooling for the conjectures pool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bittensor-core>=0.1.2,<1",
    "cryptography>=44",
    "typer>=0.27.2",
]

[project.scripts]
contrib = "conjectures_contribution.cli.main:app"
contrib-admin = "conjectures_contribution.cli.admin:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conjectures_contribution"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pyright>=1.1.390",
    "pytest>=8",
    "ruff>=0.14",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "stubs"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pyright]
include = ["src", "tests"]
stubPath = "stubs"
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Pinned upstream; not ours to lint.
extend-exclude = ["conjectures"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "DTZ",
    "EM", "ISC", "ICN", "G", "PIE", "T20", "PT", "Q", "RSE", "RET",
    "SIM", "TC", "ARG", "PTH", "ERA", "PL", "TRY", "FLY",
    "PERF", "FURB", "RUF",
]
ignore = [
    # Any is the honest type at the untyped-JSON boundary; parse narrows it.
    "ANN401",
    # Domain errors carry a formatted message. Hoisting each into a local to
    # satisfy EM/TRY003 costs a line per raise and reads worse at every site.
    "EM101",
    "EM102",
    "TRY003",
    # Parse functions reject one way at a time; early returns are the shape.
    "PLR0911",
    # Annotation-only imports in a type-checking block split every module's
    # imports in two for no gain: startup is typer + cryptography, both
    # runtime-required, and Typer resolves annotations at runtime.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "PLR2004"]
# A Typer command declares its whole CLI surface as parameters; the count is the
# interface, not a smell.
"src/conjectures_contribution/cli/*" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.isort]
known-first-party = ["conjectures_contribution"]
