# Label and rebase-merge a contribution PR once its pipeline is green.
#
# workflow_run is deliberate: this job needs a write token, but it only trusts the
# artifact produced by the default-branch `contribution-verify` workflow. It never
# checks out or executes the contribution.
name: contribution-merge

on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['contribution-verify']
    types: [completed]

# GITHUB_TOKEN is now used by exactly one step, the cross-run artifact download, which
# needs actions: read and nothing else. Everything that writes — the merge, the labels, the
# comments — goes through the app token instead, so the ambient token no longer has to carry
# write access to contents, pull requests or issues.
permissions:
  actions: read

concurrency:
  group: contribution-merge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  merge:
    name: label and rebase-merge
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.path == '.github/workflows/contribution-verify.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A push made with GITHUB_TOKEN never triggers another workflow, so the merge that
      # lands a contribution on main was invisible to `contribution-index` and the generated
      # indexes silently stopped being rebuilt. An installation token from a GitHub App is a
      # distinct identity, so the push it makes fires push triggers normally. The app is
      # installed on this repository only and holds contents, pull-requests and issues; it is
      # deliberately not granted actions, which is why the artifact below keeps GITHUB_TOKEN.
      - name: Mint an app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CONTRIB_APP_ID }}
          private-key: ${{ secrets.CONTRIB_APP_PRIVATE_KEY }}

      - name: Download trusted verification metadata
        id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-meta
          path: ${{ runner.temp }}/verified
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the metadata
        id: meta
        env:
          META: ${{ runner.temp }}/verified/verified-meta.json
        run: |
          test -f "$META"
          jq -e '
            type == "object" and
            (.pr | type == "number" and . > 0) and
            (.head_sha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.head_repo | type == "string" and
              test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")) and
            (.base_sha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.base_ref | type == "string" and test("^[A-Za-z0-9._/-]+$")) and
            (.trusted_sha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.target | type == "string" and test("^[a-z0-9][a-z0-9-]*$")) and
            (.contribution_id | type == "string" and test("^[a-z0-9][a-z0-9-]*$")) and
            (.hotkey | type == "string" and test("^[1-9A-HJ-NP-Za-km-z]*$")) and
            (.needs_review | type == "boolean")
          ' "$META" >/dev/null
          for field in pr head_sha head_repo base_sha base_ref trusted_sha target \
            contribution_id hotkey \
            needs_review; do
            echo "${field}=$(jq -r ".${field}" "$META")" >> "$GITHUB_OUTPUT"
          done

      - name: Confirm the PR is still the one we verified
        id: guard
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.meta.outputs.pr }}
          VERIFIED_SHA: ${{ steps.meta.outputs.head_sha }}
          VERIFIED_HEAD_REPO: ${{ steps.meta.outputs.head_repo }}
          VERIFIED_BASE_SHA: ${{ steps.meta.outputs.base_sha }}
          VERIFIED_BASE_REF: ${{ steps.meta.outputs.base_ref }}
        run: |
          state="$RUNNER_TEMP/pull-request.json"
          gh api "repos/$GH_REPO/pulls/$PR" > "$state"
          if [ "$(jq -r '.state' "$state")" != "open" ] \
             || [ "$(jq -r '.draft' "$state")" = "true" ]; then
            echo "PR #$PR is not an open, ready pull request" >&2
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_head="$(jq -r '.head.sha' "$state")"
          current_head_repo="$(jq -r '.head.repo.full_name' "$state")"
          if [ "$current_head" != "$VERIFIED_SHA" ] \
             || [ "$current_head_repo" != "$VERIFIED_HEAD_REPO" ]; then
            echo "PR #$PR changed after $VERIFIED_SHA was verified" >&2
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_base="$(jq -r '.base.sha' "$state")"
          current_base_ref="$(jq -r '.base.ref' "$state")"
          current_base_repo="$(jq -r '.base.repo.full_name' "$state")"
          if [ "$current_base" != "$VERIFIED_BASE_SHA" ] \
             || [ "$current_base_ref" != "$VERIFIED_BASE_REF" ] \
             || [ "$current_base_repo" != "$GH_REPO" ]; then
            echo "$VERIFIED_BASE_REF moved to $current_base after $VERIFIED_BASE_SHA was verified" >&2
            gh pr comment "$PR" --body \
              "The base branch moved after this contribution was verified. Synchronize the PR to run the checks against the new base before merging."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Label the pull request
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.meta.outputs.pr }}
          TARGET: ${{ steps.meta.outputs.target }}
          HOTKEY: ${{ steps.meta.outputs.hotkey }}
          NEEDS_REVIEW: ${{ steps.meta.outputs.needs_review }}
        run: |
          labels="target:${TARGET}"
          if [ -n "$HOTKEY" ]; then
            labels="${labels},hotkey:${HOTKEY:0:10}"
          fi
          if [ "$NEEDS_REVIEW" = "true" ]; then
            labels="${labels},needs-human-review"
          fi
          IFS=','
          for label in $labels; do
            gh label create "$label" --color ededed --force >/dev/null 2>&1 || true
          done
          unset IFS
          gh pr edit "$PR" --add-label "$labels"

      - name: Hold for human review
        if: steps.guard.outputs.proceed == 'true' && steps.meta.outputs.needs_review == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.meta.outputs.pr }}
        run: |
          gh pr comment "$PR" --body \
            "All rules pass, but some were reported for review — Lean metaprogramming, a
            global attribute, a root-namespace declaration, or an unusual elaboration
            budget. Auto-merge is on hold; see the \`static rules\` job summary."

      - name: Merge the exact verified head
        if: >-
          steps.guard.outputs.proceed == 'true' &&
          steps.meta.outputs.needs_review != 'true' &&
          vars.CONTRIB_AUTOMERGE != 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.meta.outputs.pr }}
          TARGET: ${{ steps.meta.outputs.target }}
          CONTRIBUTION_ID: ${{ steps.meta.outputs.contribution_id }}
          VERIFIED_SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          echo "merging ${TARGET}/${CONTRIBUTION_ID}"
          gh pr merge "$PR" --rebase --match-head-commit "$VERIFIED_SHA"
