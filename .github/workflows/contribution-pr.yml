# Fast feedback for contribution pull requests. A pull request can rewrite this
# workflow, so no privileged workflow trusts its result or artifacts. The
# default-branch `contribution-verify` workflow independently repeats every gate
# before it authorizes a merge.
name: contribution-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # Four segments deep: files inside a contribution directory only. A maintainer
      # PR that regenerates contributions/index.md or contributions/<target>/index.md
      # would otherwise fire this pipeline and fail C011 on its own bot output.
      - 'contributions/*/*/**'

permissions:
  contents: read

concurrency:
  group: contribution-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.11.29'
  GITLEAKS_VERSION: '8.28.0'
  # Maintainer escape hatch. Only users with write access can label a pull request, so an
  # outside contributor cannot apply this to their own submission.
  SKIP_LABEL: meta

jobs:
  static:
    name: static rules
    # The path filter above already keeps this off maintainer PRs, which touch generated
    # indexes but nothing inside a contribution directory. The label is the manual
    # override for the case the filter cannot see: a PR that legitimately adds a
    # contribution directory and something else, such as a fixture or a migration.
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'meta')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      contributions: ${{ steps.rules.outputs.contributions }}
      needs_review: ${{ steps.rules.outputs.needs_review }}
    steps:
      - name: Check out the trusted validator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          submodules: true
          persist-credentials: false

      - name: Check out the untrusted contribution
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: trusted/uv.lock

      - name: Run every rule (C001-C024)
        id: rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        working-directory: trusted
        run: >-
          uv run contrib
          --repo "$GITHUB_WORKSPACE/candidate"
          --pool "$GITHUB_WORKSPACE/trusted/conjectures"
          check --base "$BASE_SHA"

      - name: Lint YAML
        if: always() && steps.rules.outcome != 'skipped'
        working-directory: trusted
        run: >-
          uv tool run yamllint@1.35.1 -c .yamllint.yml
          "$GITHUB_WORKSPACE/candidate/contributions"

      - name: Scan for committed secrets
        env:
          CONTRIBUTIONS: ${{ steps.rules.outputs.contributions }}
        run: |
          test -n "$CONTRIBUTIONS" || { echo "no contribution to scan" >&2; exit 1; }
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          target="candidate/contributions/${CONTRIBUTIONS}"
          if ./gitleaks dir --help >/dev/null 2>&1; then
            ./gitleaks dir "$target" --config trusted/.gitleaks.toml \
              --redact --no-banner --exit-code 1
          else
            ./gitleaks detect --no-git --source "$target" \
              --config trusted/.gitleaks.toml --redact --exit-code 1
          fi

  index-preview:
    name: index preview
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted validator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          submodules: true
          persist-credentials: false

      - name: Check out the untrusted contribution
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: trusted/uv.lock

      # Indexes are rebuilt on main after the merge, never in the PR: if every
      # contribution edited an index, every contribution PR would conflict with
      # every other one. This only shows what merging will produce.
      - name: Render the index this contribution will produce
        env:
          CONTRIBUTIONS: ${{ needs.static.outputs.contributions }}
        run: |
          target="${CONTRIBUTIONS%%/*}"
          cd trusted
          uv run contrib-admin \
            --repo "$GITHUB_WORKSPACE/candidate" \
            --pool "$GITHUB_WORKSPACE/trusted/conjectures" index
          {
            echo "### Index preview — \`${target}\`"
            echo
            cat "$GITHUB_WORKSPACE/candidate/contributions/${target}/index.md"
          } >> "$GITHUB_STEP_SUMMARY"
